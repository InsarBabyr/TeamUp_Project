// Phones go to the mobile version; add ?desktop to the address to stay on this page
(function(){
  try{
    var phone=/Android.+Mobile|iPhone|iPod|Windows Phone/i.test(navigator.userAgent)||(window.matchMedia&&matchMedia('(max-width: 600px)').matches);

  }catch(e){}
})();
</script>
